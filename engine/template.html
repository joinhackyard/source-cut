<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <script src="assets/lib/gsap-3.14.2.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #07080b; }
      #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #07080b; }
      .full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .still { overflow: hidden; }
      .vw { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
      /* Real artifacts (page captures, scans, slides) on a card: camera move on .art-in, marker sweeps on .mk */
      .artc { position: absolute; overflow: hidden; background: #f4f1ea; border-radius: 6px;
              box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(241, 244, 247, 0.08); }
      .artc.full { border-radius: 0; background: #07080b; box-shadow: none; }
      .artc.phone, video.phone { position: absolute; border-radius: 34px; background: #07080b; object-fit: cover; object-position: 50% 0;
                                 box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(241, 244, 247, 0.14); }
      .vert .cap.lower { padding-top: 1380px; }
      .art-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .art-in img { display: block; width: 100%; height: 100%; }
      .mk { position: absolute; background: rgba(111, 181, 252, 0.55); mix-blend-mode: multiply; transform-origin: 0 50%; border-radius: 2px; }
      .art-label { position: absolute; left: 60px; z-index: 24; display: flex; align-items: center; gap: 12px;
                   font: 500 24px/1 "Space Grotesk", sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
                   color: rgba(241, 244, 247, 0.78); text-shadow: 0 0 14px rgba(7, 8, 11, 0.9); }
      .art-label .bar { width: 5px; height: 26px; background: #6fb5fc; display: inline-block; }
      /* Save-this checklist */
      .checklist { position: absolute; inset: 0; background: #07080b; display: flex; flex-direction: column; justify-content: center;
                   padding: 0 90px; box-sizing: border-box; z-index: 22; color: #f1f4f7; }
      .checklist .ct { font: 500 30px/1 "Space Grotesk", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #6fb5fc; margin-bottom: 54px; }
      .checklist .row { display: flex; gap: 30px; align-items: baseline; font: 600 62px/1.15 "Space Grotesk", sans-serif; letter-spacing: -0.035em; margin: 0 0 30px; opacity: 0; }
      .checklist .row b { font-weight: 500; color: rgba(241, 244, 247, 0.45); width: 46px; flex: none; }
      .still img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card { position: absolute; inset: 0; background: #07080b; }

      /* Captions: spoken words, centred, never bottom subtitles */
      .cap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
             padding: 0 180px; box-sizing: border-box; text-align: center; z-index: 20; color: #f1f4f7; pointer-events: none; }
      .cw { display: inline-block; opacity: 0; margin: 0 0.13em; }
      .st-r, .st-a { font: 400 64px/1.15 "EB Garamond", serif; letter-spacing: 0.005em;
                     text-shadow: 0 0 2px rgba(7, 8, 11, 0.95), 0 0 10px rgba(7, 8, 11, 0.75), 0 0 26px rgba(7, 8, 11, 0.55), 0 0 18px rgba(241, 244, 247, 0.22); }
      .st-a .cw { margin: 0 0.42em; }
      .st-E { font: 600 132px/1 "Space Grotesk", sans-serif; letter-spacing: -0.05em; text-shadow: 0 0 24px rgba(241, 244, 247, 0.3), 0 0 30px rgba(7, 8, 11, 0.6); }
      .st-H { font: 600 250px/0.95 "Space Grotesk", sans-serif; letter-spacing: -0.065em; text-shadow: 0 0 30px rgba(241, 244, 247, 0.28); }
      .st-S { font: 600 132px/1 "Space Grotesk", sans-serif; letter-spacing: -0.05em; }
      .st-S .hl { display: inline-block; background: #6fb5fc; color: #070d18; padding: 0.02em 0.14em 0.08em; }
      .st-S .cw { margin: 0 0.06em; }
      /* Key line (held): Space Grotesk, *word* in Hackyard blue */
      .st-K { font: 600 96px/1.04 "Space Grotesk", sans-serif; letter-spacing: -0.045em;
              text-shadow: 0 0 3px rgba(7, 8, 11, 0.9), 0 0 28px rgba(7, 8, 11, 0.7); }
      .st-T { font: 600 150px/0.98 "Space Grotesk", sans-serif; letter-spacing: -0.06em; text-shadow: 0 0 30px rgba(7, 8, 11, 0.7); }
      .st-Q { font: 400 84px/1.12 "EB Garamond", serif; font-style: italic; text-shadow: 0 0 3px rgba(7, 8, 11, 0.9), 0 0 26px rgba(7, 8, 11, 0.7); }
      /* Long-form captions: the phrase shows dimmed, each word lights as it is spoken */
      .st-L { font: 400 62px/1.2 "EB Garamond", serif; letter-spacing: 0.005em; padding: 0 260px;
              text-shadow: 0 0 2px rgba(7, 8, 11, 0.95), 0 0 10px rgba(7, 8, 11, 0.8), 0 0 28px rgba(7, 8, 11, 0.6); }
      .st-L .cw { margin: 0 0.1em; }
      .st-L .ln { display: inline-block; max-width: 100%; }
      .kl { display: inline-block; max-width: 100%; }
      .hlw { color: #6fb5fc; }

      /* Chapter card */
      .chapter { position: absolute; inset: 0; background: #07080b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 22; color: #f1f4f7; }
      .ch-n { font: 500 34px/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; color: #6fb5fc; margin-bottom: 30px; opacity: 0; }
      .ch-t { font: 600 120px/1.02 "Space Grotesk", sans-serif; letter-spacing: -0.055em; text-align: center; max-width: 80%; opacity: 0; }

      /* Corner counter, founder name, reconstruction tag */
      .counter { position: absolute; top: 54px; right: 64px; z-index: 24; font: 500 34px/1 "Space Grotesk", sans-serif; letter-spacing: 0.06em; color: #f1f4f7;
                 padding: 12px 18px; border: 2px solid rgba(241, 244, 247, 0.28); border-radius: 999px; background: rgba(7, 8, 11, 0.45); }
      .attrib { position: absolute; left: 72px; bottom: 74px; z-index: 24; display: flex; align-items: center; gap: 16px;
                font: 500 34px/1 "Space Grotesk", sans-serif; letter-spacing: -0.01em; color: #f1f4f7; text-shadow: 0 0 18px rgba(7, 8, 11, 0.8); }
      .attrib .bar { width: 6px; height: 38px; background: #6fb5fc; display: inline-block; }
      .recon { position: absolute; right: 72px; bottom: 64px; z-index: 24; font: 500 22px/1 "Space Grotesk", sans-serif; letter-spacing: 0.22em;
               text-transform: uppercase; color: rgba(241, 244, 247, 0.75); }
      .stamp { position: absolute; left: 72px; top: 58px; z-index: 24; display: flex; align-items: center; gap: 14px;
               font: 500 28px/1 "Space Grotesk", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #f1f4f7;
               text-shadow: 0 0 16px rgba(7, 8, 11, 0.85); }
      .stamp .bar { width: 6px; height: 30px; background: #6fb5fc; display: inline-block; }
      .prog { display: flex; gap: 14px; margin-top: 46px; }
      .prog span { width: 64px; height: 6px; background: rgba(241, 244, 247, 0.2); transform-origin: 0 50%; }
      .prog span.on { background: #6fb5fc; }

      /* End card: the real H monogram + name */
      #endcard { position: absolute; inset: 0; background: #07080b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; }
      #end-wordmark { display: inline-flex; align-items: center; color: #f1f4f7; font: 500 92px/1.1 "Space Grotesk", sans-serif; letter-spacing: -0.045em; }
      #end-sub { margin-top: 34px; font: 400 34px/1.3 "Space Grotesk", sans-serif; color: rgba(241, 244, 247, 0.72); letter-spacing: -0.01em; opacity: 0; }
      #end-mark { position: relative; width: 0.78em; height: 0.88em; margin-right: 0.3em; }
      #end-mark span { position: absolute; background: #6fb5fc; }
      #end-mark .rail { top: 11.71875%; left: 11.4035%; width: 4.386%; height: 76.5625%; }
      #end-mark .rail.r2 { left: 85.0877%; }
      #end-mark .bridge { top: 47.65625%; left: 13.1579%; width: 73.6842%; height: 4.6875%; }
      #end-mark .node { width: 26.3158%; height: 23.4375%; border-radius: 2px; }
      #end-mark .n1 { top: 0; left: 0; } #end-mark .n2 { top: 0; left: 73.6842%; }
      #end-mark .n3 { top: 38.28125%; left: 0; } #end-mark .n4 { top: 38.28125%; left: 73.6842%; }
      #end-mark .n5 { top: 76.5625%; left: 0; } #end-mark .n6 { top: 76.5625%; left: 73.6842%; }

      /* 16:9: captions under an artifact card or archival window */
      .land .cap.low { padding-top: 840px; }
      .qgrad { position: absolute; left: 0; right: 0; bottom: 0; height: 440px; z-index: 5;
               background: linear-gradient(0deg, rgba(7, 8, 11, 0.86) 0%, rgba(7, 8, 11, 0.6) 45%, rgba(7, 8, 11, 0) 100%); }
      .land .attrib.tl { top: 64px; bottom: auto; left: 72px; font-size: 28px; text-shadow: 0 0 18px rgba(7, 8, 11, 0.95); }
      .land .attrib.top { top: 706px; bottom: auto; left: 580px; font-size: 28px; }
      /* 16:9 film: archive footage window, bar chart, timeline */
      .bwin { position: absolute; overflow: hidden; border-radius: 6px; }
      .barcard, .tlcard { position: absolute; inset: 0; background: #07080b; z-index: 21; color: #f1f4f7; }
      .b-t { position: absolute; left: 300px; top: 120px; font: 600 54px/1 "Space Grotesk", sans-serif; letter-spacing: -0.03em; }
      .b-t small { margin-left: 18px; font: 500 24px/1 "Space Grotesk", sans-serif; letter-spacing: 0.14em; color: rgba(241, 244, 247, 0.6); }
      .b-box { position: absolute; left: 300px; top: 230px; width: 1320px; height: 600px; display: flex; justify-content: space-around; }
      .b-box .zero { position: absolute; left: 0; right: 0; top: 300px; height: 2px; background: rgba(241, 244, 247, 0.35); }
      .bcol { position: relative; width: 170px; }
      .bcol .bar { position: absolute; left: 0; width: 170px; }
      .bcol .bar.pos { bottom: 300px; background: #6fb5fc; transform-origin: 50% 100%; }
      .bcol .bar.neg { top: 302px; background: rgba(241, 244, 247, 0.85); transform-origin: 50% 0; }
      .bcol .bar span { position: absolute; left: 0; right: 0; text-align: center; font: 600 36px/1 "Space Grotesk", sans-serif; letter-spacing: -0.02em; }
      .bcol .bar.pos span { top: -50px; } .bcol .bar.neg span { bottom: -50px; }
      .bcol .bl { position: absolute; left: 0; right: 0; top: 690px; text-align: center; font: 500 30px/1 "Space Grotesk", sans-serif; color: rgba(241, 244, 247, 0.75); }
      .t-line { position: absolute; left: 200px; right: 200px; top: 560px; height: 4px; background: rgba(241, 244, 247, 0.25); }
      .tk { position: absolute; top: -10px; width: 4px; height: 24px; margin-left: -2px; background: rgba(241, 244, 247, 0.6); }
      .tk b { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font: 500 32px/1 "Space Grotesk", sans-serif; color: rgba(241, 244, 247, 0.75); }
      .t-span { position: absolute; top: -6px; height: 16px; background: #6fb5fc; transform-origin: 0 50%; border-radius: 3px; }
      .t-lab { position: absolute; top: -130px; transform: translateX(-50%); white-space: nowrap; font: 600 84px/1 "Space Grotesk", sans-serif; letter-spacing: -0.04em; color: #f1f4f7; }
      /* Money counter, quote card, product grid, two-option choice */
      .numcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 21;
                 color: #f1f4f7; background: rgba(7, 8, 11, 0.55); }
      .nm-v { font: 600 190px/1 "Space Grotesk", sans-serif; letter-spacing: -0.05em; color: #6fb5fc; font-variant-numeric: tabular-nums;
              text-shadow: 0 0 40px rgba(7, 8, 11, 0.8); }
      .nm-s { margin-top: 26px; font: 500 30px/1 "Space Grotesk", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(241, 244, 247, 0.75); }
      .vert .nm-v { font-size: 120px; }
      .qcard { position: absolute; inset: 0; background: #07080b; display: flex; flex-direction: column; align-items: center; justify-content: center;
               padding: 0 220px; box-sizing: border-box; z-index: 21; color: #f1f4f7; text-align: center; }
      .q-t { font: 400 76px/1.18 "EB Garamond", serif; font-style: italic; opacity: 0; }
      .q-a { margin-top: 44px; display: flex; align-items: center; gap: 14px; font: 500 28px/1 "Space Grotesk", sans-serif; letter-spacing: 0.12em;
             text-transform: uppercase; color: rgba(241, 244, 247, 0.72); opacity: 0; }
      .q-a .bar, .hmark .bar { width: 6px; height: 30px; background: #6fb5fc; display: inline-block; }
      .vert .qcard { padding: 0 80px; } .vert .q-t { font-size: 70px; } .vert .q-a { font-size: 26px; }
      .gridcard { position: absolute; inset: 0; background: #07080b; z-index: 21; color: #f1f4f7; }
      .g-box { position: absolute; left: 560px; top: 150px; width: 1000px; height: 640px; }
      .gl { position: absolute; background: #6fb5fc; }
      .gv { left: 50%; top: 0; width: 6px; height: 100%; margin-left: -3px; transform-origin: 50% 0; }
      .gh { top: 50%; left: 0; height: 6px; width: 100%; margin-top: -3px; transform-origin: 0 50%; }
      .g-c, .g-r { position: absolute; font: 500 34px/1 "Space Grotesk", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(241, 244, 247, 0.8); }
      .g-c { top: -64px; width: 50%; text-align: center; } .g-c.c1 { left: 0; } .g-c.c2 { left: 50%; }
      .g-r { left: -300px; width: 260px; text-align: right; } .g-r.r1 { top: 25%; } .g-r.r2 { top: 75%; }
      .g-r { margin-top: -17px; }
      .gc { position: absolute; width: 50%; height: 50%; display: flex; align-items: center; justify-content: center;
            font: 600 64px/1 "Space Grotesk", sans-serif; letter-spacing: -0.04em; }
      .gc:nth-of-type(1) { left: 0; top: 0; } .gc:nth-of-type(2) { left: 50%; top: 0; } .gc:nth-of-type(3) { left: 0; top: 50%; } .gc:nth-of-type(4) { left: 50%; top: 50%; }
      .choicecard { position: absolute; inset: 0; background: rgba(7, 8, 11, 0.72); display: flex; align-items: center; justify-content: center; gap: 90px;
                    z-index: 21; color: #f1f4f7; padding-bottom: 260px; box-sizing: border-box; }
      .ch-o { font: 600 150px/1 "Space Grotesk", sans-serif; letter-spacing: -0.05em; opacity: 0; }
      .ch-or { font: 400 italic 60px/1 "EB Garamond", serif; color: rgba(241, 244, 247, 0.6); opacity: 0; }
      .hmark { position: absolute; left: 70px; top: 1700px; z-index: 24; font: 500 34px/1 "Space Grotesk", sans-serif; letter-spacing: -0.01em;
               color: rgba(241, 244, 247, 0.85); text-shadow: 0 0 16px rgba(7, 8, 11, 0.9); }

      /* 9:16: narrower text block, safe band away from platform UI */
      .vert .cap { padding: 0 76px; }
      .vert .st-r, .vert .st-a { font-size: 80px; }
      .vert .st-E { font-size: 118px; }
      .vert .st-S { font-size: 96px; }
      .vert .st-H { font-size: 200px; }
      .vert .st-K { font-size: 88px; }
      .vert .st-T { font-size: 80px; padding: 0 40px 1000px; }
      /* frame-one hook (st-O): above the photo card (y ~280–520) so the face stays clear (producer feedback, 3 Nov 2026), on a solid brand plate */
      .st-O { font: 600 150px/0.98 "Space Grotesk", sans-serif; letter-spacing: -0.06em; }
      .vert .st-O { font-size: 92px; padding: 0 60px 1120px; }
      .vert .st-O .kl { background: rgba(7, 8, 11, 0.9); padding: 26px 40px 34px; border-radius: 10px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55); text-shadow: none; }
      .vert .cap.low { padding-top: 940px; }
      .vert .band { top: 656px; height: 608px; }
      .vert .counter { top: 230px; right: 60px; font-size: 38px; }
      .vert .attrib { left: 70px; bottom: auto; top: 1292px; font-size: 36px; }
      .vert .recon { top: 230px; left: 70px; }
      .vert .ch-t { font-size: 104px; max-width: 86%; }
      .vert #end-wordmark { font-size: 96px; }
      .vert #end-sub { font-size: 40px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="{{ORIENT}}"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="{{W}}"
      data-height="{{H}}"
    >
      {{CLIPS}}
    </div>
    <script>
      (function () {
        gsap.set(".cw", { opacity: 0 });
        const tl = gsap.timeline({ paused: true });
        /*TWEENS*/
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
